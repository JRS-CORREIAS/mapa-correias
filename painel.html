<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="robots" content="noindex">
<title>Mapa das Correias</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b1622;--card:#12233a;--tx:#eef3f8;--mut:#9fb0c1;--ouro:#c8a96a}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
.c{max-width:440px;width:100%;background:var(--card);border:1px solid rgba(200,169,106,.3);border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}
img{width:84px;height:84px;border-radius:20px}
h1{font-size:24px;margin:16px 0 6px}
.tag{display:inline-block;margin:6px 0 14px;padding:5px 14px;border-radius:99px;background:rgba(200,169,106,.16);color:var(--ouro);font-weight:800;font-size:14px;letter-spacing:.04em}
p{color:var(--mut);margin:0 0 10px}
.dev{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:14px;color:var(--mut)}
a{color:var(--ouro);font-weight:700}
</style>
</head>
<body>
<main><div class="c">
<img src="icon-192.png" alt="">
<h1>Mapa das Correias</h1>
<div class="tag">ACESSO PAUSADO</div>
<p>O app e o Mapa de faróis estão temporariamente fora do ar.</p>
<p>Os dados já registrados estão guardados. Assim que o acesso for liberado, é só abrir de novo.</p>
<div class="dev">Dúvidas: <a href="https://wa.me/5531982613138" target="_blank" rel="noopener">falar com Jeferson Rodrigo dos Santos</a></div>
</div></main>
<script>
// pausa: apaga a cópia antiga do app guardada no aparelho, para não abrir a versão anterior sem internet
try { if ('caches' in window) caches.keys().then(ks => ks.filter(k => k.indexOf('mapa-correias-') === 0 && k !== 'mapa-correias-pausa').forEach(k => caches.delete(k))); } catch (e) { }
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => { }); } catch (e) { }
</script>
</body>
</html>
