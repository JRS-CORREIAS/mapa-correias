<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa de faróis · Mapa das Correias</title>
<meta name="theme-color" content="#0c1822">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Painel para projetar em reunião: fundo grafite, números grandes, semáforo dos equipamentos como peça central. */
:root{color-scheme:dark;
--bg:#0c1822;--p1:#132331;--p2:#1b3144;--ln:#25405a;--tx:#eaf0f5;--mut:#93a7b8;--az:#4d9be0;
--vm:#ef4a3c;--am:#f5c02b;--vd:#43c463;--cz:#6b7f91;
--f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--f);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-stretch:115%;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--az);outline-offset:2px}
.wrap{max-width:1800px;margin:0 auto;padding:22px 28px 30px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.marca{display:flex;align-items:center;gap:14px;flex:1;min-width:260px}
.marca img{width:46px;height:46px;border-radius:12px}
.marca h1{font-size:26px;font-weight:800;font-stretch:120%}
.marca p{margin:2px 0 0;color:var(--mut);font-size:14px}
.seg{display:flex;background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);padding:9px 18px;border-radius:10px;font-weight:650;cursor:pointer}
.seg button.on{background:var(--az);color:#06121c}
.hora{text-align:right;color:var(--mut);font-size:13px;min-width:150px}
.hora b{display:block;color:var(--tx);font-size:26px;font-weight:700;font-stretch:115%}
.ic{border:1px solid var(--ln);background:var(--p1);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--tx);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.k{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;min-width:0;position:relative;overflow:hidden}
.k .r{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:8px}
.k .r i{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.k b{display:block;font-size:clamp(34px,3.6vw,58px);font-weight:800;font-stretch:122%;line-height:1.05;margin-top:8px}
.k .v{font-size:clamp(15px,1.3vw,21px);font-weight:600;margin-top:4px}
.k .s{font-size:13px;color:var(--mut);margin-top:6px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#0a141d;margin-top:10px}
.bar i{display:block;height:100%}
.g{background:var(--vd)}.y{background:var(--am)}.rr{background:var(--vm)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.pn{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;min-width:0}
.pn+.pn{margin-top:18px}
.pt{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pt h2{font-size:21px;font-weight:700;flex:1}
.pt span{color:var(--mut);font-size:14px}
.cont{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cont div{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:99px;padding:6px 14px;font-size:14px}
.cont b{font-size:18px}
.cont i{width:12px;height:12px;border-radius:50%}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.eq{display:flex;gap:14px;background:var(--p2);border-radius:14px;padding:14px;border-left:5px solid var(--cz);min-width:0}
.eq.vm{border-left-color:var(--vm)}.eq.am{border-left-color:var(--am)}.eq.vd{border-left-color:var(--vd)}
.sem{display:flex;flex-direction:column;gap:6px;background:#08121a;padding:7px;border-radius:14px;align-self:flex-start;flex:none}
.sem i{width:20px;height:20px;border-radius:50%;background:#26394a}
.sem i.on.vm{background:var(--vm);box-shadow:0 0 14px var(--vm)}.sem i.on.am{background:var(--am);box-shadow:0 0 14px var(--am)}.sem i.on.vd{background:var(--vd);box-shadow:0 0 14px var(--vd)}
.eq .f{flex:1;min-width:0}
.eq h3{font-size:20px;font-weight:800;font-stretch:118%}
.eq .m{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .n{display:flex;gap:12px;font-size:13.5px;margin-top:7px;flex-wrap:wrap}
.eq .n em{font-style:normal;font-weight:700}
.eq .st{font-size:12.5px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:9px 8px;border-bottom:1px solid #1c3044;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tt td{border-bottom:0;font-weight:800;font-size:16px;padding-top:12px}
.hb{height:7px;border-radius:99px;background:#0a141d;overflow:hidden;display:flex;margin-top:5px;min-width:80px}
.vmT{color:var(--vm)}.amT{color:var(--am)}
.vazio{color:var(--mut);padding:18px 4px;text-align:center}
.rod{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:20px}
.aviso{background:#3a2a05;color:#ffd77a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.con{max-width:460px;margin:12vh auto;background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:26px}
.con label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.con input{width:100%;background:#0a141d;border:1px solid var(--ln);border-radius:12px;padding:12px;color:var(--tx)}
.con button{margin-top:18px;width:100%;border:0;border-radius:12px;padding:13px;background:var(--az);color:#06121c;font-weight:700;cursor:pointer}
.con p{color:var(--mut);font-size:14px}
.eq.click,tr.click{cursor:pointer}
.eq.click:hover{background:#21394e}.eq.click:focus-visible,tr.click:focus-visible{outline:3px solid var(--az)}
tr.click:hover td{background:#17293a}
.volta{border:0;background:none;color:var(--az);font-weight:700;font-size:16px;cursor:pointer;padding:6px 0;margin-bottom:12px}
.det{display:flex;align-items:center;gap:20px;background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:20px 24px;margin-bottom:18px;flex-wrap:wrap}
.det .sem{flex-direction:row;padding:9px;gap:9px}.det .sem i{width:30px;height:30px}
.det h2{font-size:clamp(30px,3vw,46px);font-weight:800;font-stretch:122%}
.det .m{color:var(--mut);font-size:15px;margin-top:4px}
.det .f{flex:1;min-width:240px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:3px 11px;background:#22405c;color:#a9d1f5;vertical-align:middle;margin-left:8px;font-stretch:100%}
.tag.dos{background:#4a3a08;color:#ffd77a}
.av{background:#3b1414;color:#ffb3ab;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;margin-top:4px;display:inline-block}
.av.am{background:#3a2a05;color:#ffd77a}
.cod{display:inline-block;background:#08121a;border:1px solid var(--ln);border-radius:8px;padding:2px 8px;font-weight:700;font-size:13.5px}
.sit{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}
.sit.vm{background:var(--vm);color:#fff}.sit.am{background:var(--am);color:#2b1f00}
.eqd+.eqd{margin-top:18px}
.eqd .cab{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.eqd .cab .sem{flex-direction:row}
.eqd .cab h3{font-size:24px;font-weight:800;font-stretch:118%}
.eqd .cab .f{flex:1;min-width:220px}
.mini{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;color:var(--mut)}
.mini b{color:var(--tx);font-size:18px}
.ic.on{background:var(--az);color:#06121c}
body.ajuste .det,body.ajuste .rod{display:none}
/* idade da última inspeção (nome do equipamento) */
.mapa .dias{font-size:14px;font-stretch:90%;font-weight:800;text-align:center;margin:4px auto 2px;padding:1px 4px;border-radius:6px;white-space:nowrap;opacity:.75}
.mapawrap .mapa th.idade-am .eqn{color:#d99a00!important}
.mapawrap .mapa th.idade-vm .eqn{color:#e0352a!important}
.mapawrap .mapa th.idade-nv .eqn{color:#8a97a5!important}
.mapawrap .mapa th.idade-am .dias{background:rgba(240,180,0,.22);color:#c58a00;opacity:1}
.mapawrap .mapa th.idade-vm .dias{background:rgba(230,50,40,.18);color:#e0352a;opacity:1}
.mapawrap .mapa th.idade-nv .dias{color:#8a97a5}
.mapawrap.m-escuro .mapa th.idade-vm .eqn,.mapawrap.m-escuro .mapa th.idade-vm .dias{color:#ff6b5e!important}
.mapawrap.m-escuro .mapa th.idade-am .eqn,.mapawrap.m-escuro .mapa th.idade-am .dias{color:#ffc93c!important}
.idleg{margin-top:8px;align-items:center}
.idleg .pt{width:12px;height:12px;border-radius:3px;display:inline-block}
.idleg .pt.ok{background:var(--tx);opacity:.75}.idleg .pt.am{background:#e6a800}.idleg .pt.vm{background:#e0352a}.idleg .pt.nv{background:#8a97a5}
.idleg .venc{color:#e0352a;font-weight:700}
.mapa-ctl>.leg-blk{display:flex;flex-direction:column}
/* ===== Mapa de faróis: 3 estilos (básico, premium, super premium) × claro ou escuro ===== */
.temas{display:flex;align-items:center;gap:8px;margin-right:6px}
.temas>span{color:var(--mut);font-size:14px}
.temas .seg button{padding:8px 12px;font-size:13.5px}
.mapawrap .mapa th.tit,.mapawrap .mapa th.sub{text-align:center}
.mapawrap .mapa th.sub{white-space:nowrap}
.mapawrap .mapa th.sub.tipo{font-size:14px;letter-spacing:.1em;padding:8px 12px}
.mapa .tit .nm{display:inline-block;letter-spacing:.06em;text-transform:uppercase}
.mapa .cint{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;height:100%;padding:12px 14px;text-align:left;gap:2px}
.mapa .cint b{font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.mapa .cint span{font-size:12.5px;font-weight:600;opacity:.7}
.mapa th.cin{vertical-align:bottom}
.mapa .fi{transition:transform .15s}
.mapa .cel:hover .fi{transform:scale(1.12)}
/* Básico claro: limpo */
.t-basico.m-claro .mapa{background:#fff;border-left-color:#fff;box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}
.t-basico.m-claro .mapa th,.t-basico.m-claro .mapa td{border-color:#d3d9df}
.t-basico.m-claro .mapa .tit{background:#f4f6f8;color:#14212c;font-size:16px;border-bottom:2px solid #14212c}
.t-basico.m-claro .mapa .sub{background:#f9fafb;color:#5d6b78;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.t-basico.m-claro .mapa th.cin,.t-basico.m-claro .mapa th.fx{background:#eef1f4;color:#14212c}
.t-basico.m-claro .mapa .ini{border-left:3px solid #14212c}
.t-basico.m-claro .mapa tbody tr:nth-child(even) td{background:#fafbfc}
/* Básico escuro */
.t-basico.m-escuro .mapa{background:#0f1a24;border-left-color:#0f1a24;color:#e6edf3;box-shadow:inset 0 0 0 1px #223345}
.t-basico.m-escuro .mapa table{color:#e6edf3}
.t-basico.m-escuro .mapa th,.t-basico.m-escuro .mapa td{border-color:#223345;color:#e6edf3}
.t-basico.m-escuro .mapa .tit{background:#16263a;color:#fff;font-size:16px;border-bottom:2px solid #4d9be0}
.t-basico.m-escuro .mapa .sub{background:#132131;color:#8fa6ba;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.t-basico.m-escuro .mapa th.cin,.t-basico.m-escuro .mapa th.fx{background:#16263a;color:#fff}
.t-basico.m-escuro .mapa .fx,.t-basico.m-escuro .mapa .fx2,.t-basico.m-escuro .mapa .fx3,.t-basico.m-escuro .mapa .gr{background:#0f1a24}
.t-basico.m-escuro .mapa td.fx,.t-basico.m-escuro .mapa td.fx2,.t-basico.m-escuro .mapa td.fx3{box-shadow:inset -1px 0 0 #223345}
.t-basico.m-escuro .mapa .ini{border-left:3px solid #4d9be0}
.t-basico.m-escuro .mapa tbody tr:nth-child(even) td:not(.fx):not(.fx2):not(.fx3):not(.gr){background:#122030}
.t-basico.m-escuro .mapa .cel:hover{background:#1b3047!important}
.t-basico.m-escuro .mapa .vaz{color:#3c5266}
.t-basico.m-escuro .fi.vd .b{fill:#0f3320;stroke:#34c26a}.t-basico.m-escuro .fi.vd .g{stroke:#6ff0a0}
.t-basico.m-escuro .fi.am .b{fill:#3a2b05;stroke:#f0b429}.t-basico.m-escuro .fi.am .g{stroke:#ffd166}.t-basico.m-escuro .fi.am .gd{fill:#ffd166}
.t-basico.m-escuro .fi.vm .b{fill:#3d1210;stroke:#ff5a4e}.t-basico.m-escuro .fi.vm .g{stroke:#ff8a80}
.t-basico.m-escuro .fi.na .b{fill:#0f2547;stroke:#4c94ff}.t-basico.m-escuro .fi.na .gt{fill:#9cc4ff}
/* Premium escuro: azul-noite com dourado */
.t-premium.m-escuro .mapa{background:linear-gradient(180deg,#102236,#0b1622);border:1px solid rgba(200,169,106,.35);border-left:1px solid rgba(200,169,106,.35);padding:14px;color:#e8edf2;box-shadow:0 24px 50px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04)}
.t-premium.m-escuro .mapa table{color:#e8edf2}
.t-premium.m-escuro .mapa th,.t-premium.m-escuro .mapa td{border-color:rgba(200,169,106,.16);color:#e8edf2}
.t-premium.m-escuro .mapa .tit{background:linear-gradient(180deg,#1a2f45,#13253a);color:#e7cf96;font-size:16px;font-weight:800;border-bottom:2px solid #c8a96a;padding:12px}
.t-premium.m-escuro .mapa .sub{background:#0f1f30;color:#b9a473;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.t-premium.m-escuro .mapa th.cin,.t-premium.m-escuro .mapa th.fx{background:linear-gradient(160deg,#1a2f45,#0f1f30);color:#e7cf96}
.t-premium.m-escuro .mapa .eqn{color:#dfe7ee;font-weight:700}
.t-premium.m-escuro .mapa .fx,.t-premium.m-escuro .mapa .fx2,.t-premium.m-escuro .mapa .fx3,.t-premium.m-escuro .mapa .gr{background:#0e1d2d;color:#f1f4f7}
.t-premium.m-escuro .mapa td.n{color:#c8a96a}
.t-premium.m-escuro .mapa .gr{color:#c8a96a}
.t-premium.m-escuro .mapa td.fx,.t-premium.m-escuro .mapa td.fx2,.t-premium.m-escuro .mapa td.fx3{box-shadow:inset -1px 0 0 rgba(200,169,106,.3)}
.t-premium.m-escuro .mapa .ini{border-left:2px solid #c8a96a}
.t-premium.m-escuro .mapa tbody tr:nth-child(even) td:not(.fx):not(.fx2):not(.fx3):not(.gr){background:rgba(255,255,255,.025)}
.t-premium.m-escuro .mapa .cel:hover{background:rgba(200,169,106,.14)!important}
.t-premium.m-escuro .mapa .vaz{color:#44576b}
.t-premium.m-escuro .fi .b{stroke:rgba(255,255,255,.18);stroke-width:1.5}
.t-premium.m-escuro .fi.vd .b{fill:#2fa65a}.t-premium.m-escuro .fi.vd .g{stroke:#fff}
.t-premium.m-escuro .fi.am .b{fill:#e6ad1c}.t-premium.m-escuro .fi.am .g{stroke:#3b2a00}.t-premium.m-escuro .fi.am .gd{fill:#3b2a00}
.t-premium.m-escuro .fi.vm .b{fill:#d23b30}.t-premium.m-escuro .fi.vm .g{stroke:#fff}
.t-premium.m-escuro .fi.na .b{fill:#2f74d6}.t-premium.m-escuro .fi.na .gt{fill:#fff}
/* Super premium escuro: vidro, luz e faróis acesos */
.t-super.m-escuro .mapa{background:radial-gradient(900px 300px at 20% -10%,rgba(124,92,255,.25),transparent 60%),radial-gradient(900px 340px at 90% 0%,rgba(0,200,255,.18),transparent 60%),linear-gradient(180deg,#0b1020,#070b16);border:1px solid rgba(255,255,255,.12);border-left:1px solid rgba(255,255,255,.12);padding:16px;color:#eef2ff;box-shadow:0 30px 70px -30px rgba(0,0,0,.9),0 0 0 1px rgba(124,92,255,.15),inset 0 1px 0 rgba(255,255,255,.08)}
.t-super.m-escuro .mapa table{color:#eef2ff;border-collapse:separate;border-spacing:0}
.t-super.m-escuro .mapa th,.t-super.m-escuro .mapa td{border:0;border-right:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);color:#eef2ff}
.t-super.m-escuro .mapa .tit{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));font-size:17px;padding:14px;border-bottom:1px solid rgba(255,255,255,.18)}
.t-super.m-escuro .mapa .tit .nm{background:linear-gradient(90deg,#ffe3a3,#ffffff 45%,#a8c7ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.t-super.m-escuro .mapa .sub{color:#9aa7d6;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;background:rgba(255,255,255,.02)}
.t-super.m-escuro .mapa th.cin,.t-super.m-escuro .mapa th.fx{background:#11172b;color:#fff}
.t-super.m-escuro .mapa .cint b{background:linear-gradient(90deg,#ffe3a3,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-super.m-escuro .mapa .eqn{color:#dfe6ff;font-weight:700}
.t-super.m-escuro .mapa .fx,.t-super.m-escuro .mapa .fx2,.t-super.m-escuro .mapa .fx3,.t-super.m-escuro .mapa .gr{background:#0d1324;color:#f3f5ff}
.t-super.m-escuro .mapa td.n{color:#a99cff}
.t-super.m-escuro .mapa .gr{color:#a99cff}
.t-super.m-escuro .mapa td.fx,.t-super.m-escuro .mapa td.fx2,.t-super.m-escuro .mapa td.fx3{box-shadow:inset -1px 0 0 rgba(255,255,255,.12)}
.t-super.m-escuro .mapa .ini{border-left:1px solid rgba(255,227,163,.55)}
.t-super.m-escuro .mapa tbody tr:hover td:not(.fx):not(.fx2):not(.fx3):not(.gr){background:rgba(255,255,255,.035)}
.t-super.m-escuro .mapa .cel:hover{background:rgba(124,92,255,.18)!important}
.t-super.m-escuro .mapa .vaz{color:#3a4466}
.t-super.m-escuro .fi .b{stroke:rgba(255,255,255,.35);stroke-width:1.2}
.t-super.m-escuro .fi .g{stroke:rgba(255,255,255,.92)}.t-super.m-escuro .fi .gd{fill:rgba(255,255,255,.92)}.t-super.m-escuro .fi .gt{fill:#fff}
.t-super.m-escuro .fi.vd .b{fill:url(#spvd)}.t-super.m-escuro .fi.vd{filter:drop-shadow(0 0 5px rgba(54,224,126,.55))}
.t-super.m-escuro .fi.am .b{fill:url(#spam)}.t-super.m-escuro .fi.am{filter:drop-shadow(0 0 5px rgba(255,198,41,.6))}.t-super.m-escuro .fi.am .g{stroke:#3b2600}.t-super.m-escuro .fi.am .gd{fill:#3b2600}
.t-super.m-escuro .fi.vm .b{fill:url(#spvm)}.t-super.m-escuro .fi.vm{filter:drop-shadow(0 0 6px rgba(255,74,61,.65))}
.t-super.m-escuro .fi.na .b{fill:url(#spna)}.t-super.m-escuro .fi.na{filter:drop-shadow(0 0 5px rgba(76,148,255,.55))}
body.ajuste .wrap{padding-top:10px;padding-bottom:6px}
body.ajuste header{margin-bottom:10px}
body.ajuste .mapa-ctl{margin-bottom:8px}
body.ajuste .mapa{margin-bottom:0;padding-top:8px;padding-bottom:8px}
.mapa-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.mapa-ctl select{background:var(--p1);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600}

.mapa .cin{background:#d9d9d9}
.mapa .n{width:34px;text-align:center;font-weight:800;font-size:17px}
.mapa .ptn{padding:8px 12px;font-weight:700;font-size:18.5px;font-stretch:78%;letter-spacing:.025em;white-space:nowrap;text-transform:uppercase}
.mapa .gr{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;width:30px;text-align:center}

/* "Ajustar à tela": encaixa a tabela inteira do mapa na largura e na altura da janela, sem rolar.

/* nome do equipamento ocupa toda a altura reservada: o maior nome do mapa define o tamanho da letra */
function encherNomes(t) {
  const l = [...t.querySelectorAll('.eqn')]; if (!l.length) return;
  l.forEach(x => { x.style.fontSize = '20px'; x.style.height = 'auto'; });
  const maior = Math.max(...l.map(x => x.scrollHeight - 20));   // comprimento do texto (sem o espaço de cima e de baixo)
  const f = Math.max(20, Math.min(23, 20 * 150 / Math.max(1, maior)));   // entre 20 e 23 px (deixa um respiro entre as colunas)
  const alt = Math.max(168, Math.ceil(maior * f / 20 + 22));                // nomes muito longos ganham mais altura
  l.forEach(x => { x.style.fontSize = f.toFixed(1) + 'px'; x.style.height = alt + 'px'; });
}
function ajustarMapa() {
  document.body.classList.toggle('ajuste', !!S.ajuste);
  focoClasse();
  const box = document.querySelector('.mapa'), t = box && box.querySelector('table');
  if (!t) return;
  t.style.zoom = '';
  encherNomes(t);
  if (!S.ajuste) { box.style.overflowX = ''; return; }
  box.style.overflowX = 'hidden';
  const cs = getComputedStyle(box);
  const w = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const h = window.innerHeight - box.getBoundingClientRect().top - window.scrollY - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (document.body.classList.contains('foco') ? 6 : 14);
  const nw = t.offsetWidth, nh = t.offsetHeight;
  if (!nw || !nh) return;
  const z = Math.max(.25, Math.min(w / nw, h / nh, 5));   // até 5x: em TV 4K o mapa ocupa a tela toda
  t.style.zoom = z.toFixed(3);
}

  return `<section class="det"><div class="f"><h2>${DISC[S.disc].titulo}</h2><div class="m">${S.disc === 'bal' ? 'Farol de cada item das balanças dosadoras e de fluxo' : S.disc === 'ele' ? 'Farol de cada item elétrico e de instrumentação do transportador' : 'Farol de cada parte do transportador'}, marcado pelo inspetor na inspeção · clique numa célula para ver quem avaliou e quando</div></div></section>
  <div class="mapawrap t-${S.tema} m-${S.modo}">
  <div class="mapa-ctl"><h2 class="titmini">${DISC[S.disc].ico} ${DISC[S.disc].titulo}</h2><div class="temas"><div class="seg disc">${Object.keys(DISC).map(k => `<button class="${S.disc === k ? 'on' : ''}" data-disc="${k}">${DISC[k].ico} ${DISC[k].nome}</button>`).join('')}</div></div><div class="temas modo"><div class="seg">${[['claro', '☀ Claro'], ['escuro', '☾ Escuro']].map(([k, n]) => `<button class="${S.modo === k ? 'on' : ''}" data-modo="${k}">${n}</button>`).join('')}</div></div><div class="temas estilo"><span>Estilo</span><div class="seg">${TEMAS.map(([k, n]) => `<button class="${S.tema === k ? 'on' : ''}" data-tema="${k}">${n}</button>`).join('')}</div></div><label for="mInsp" style="color:var(--mut)">Inspetor</label><select id="mInsp"><option value="">Todos os inspetores</option>${ids.map(id => `<option value="${esc(id)}" ${S.mapaInsp === id ? 'selected' : ''}>${esc(C.I[id].nome)}</option>`).join('')}</select>
    <div class="leg"><span>${ICF('vd').replace('<svg', '<svg width="22" height="22"')} Bom</span><span>${ICF('am').replace('<svg', '<svg width="22" height="22"')} Atenção</span><span>${ICF('vm').replace('<svg', '<svg width="22" height="22"')} Crítico</span><span>${ICF('na').replace('<svg', '<svg width="22" height="22"')} Não se aplica</span><span>— sem avaliação</span><span><i class="legcm"></i> com comentário (passe o mouse)</span>${S.disc === 'bal' ? '<span><b class="tbal" style="font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(77,155,224,.18);color:#4d9be0">FLX</b> balança de fluxo</span><span><b style="font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(160,110,255,.2);color:#a07aff">DOS</b> dosadora</span>' : ''}</div>
    <div class="leg idleg"><b>Última inspeção:</b><span><i class="pt ok"></i>até ${PRAZO_ALERTA} dias</span><span><i class="pt am"></i>${PRAZO_ALERTA + 1} a ${PRAZO_VENCIDO} dias</span><span><i class="pt vm"></i>mais de ${PRAZO_VENCIDO} dias</span><span><i class="pt nv"></i>nunca</span>${(() => { const v = todos.filter(x => ['vm', 'nv'].includes(idadeInsp(x.e).c)).length; return v ? `<span class="venc">⚠ ${v} ${v === 1 ? 'equipamento' : 'equipamentos'} com inspeção vencida ou nunca feita</span>` : ''; })()}</div></div>
  ${blocos || '<section class="pn"><div class="vazio">Nenhum equipamento para mostrar.</div></section>'}</div>`;
}
/* dica ao passar o mouse sobre o farol: item, cor, data, quem avaliou e o comentário (se tiver) */
let _CM = null;
const tipEl = () => document.getElementById('tipFarol') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'tipFarol' }));
function tipMostrar(td, ev) {
  if (!_CM) return;
  const [eid, k] = td.dataset.cel.split('|'), e = _CM.d.equip.find(x => x.id === eid), m = MAPA.find(x => x.k === k); if (!e || !m) return;
  const x = (e.partes || {})[k], t = tipEl();
  t.innerHTML = `<div class="tt">${esc(e.nome)} · ${m.n} ${esc(m.nome)}</div>`
    + (x ? `<div class="tf">${ICF(x.f).replace('<svg', '<svg width="18" height="18"')}<b>${FAROL[x.f]}</b><span>${fData(x.em)}${_CM.I[x.por] ? ' · ' + esc(_CM.I[x.por].nome) : ''}</span></div>${x.c ? `<div class="tc">💬 ${esc(x.c)}</div>` : ''}` : '<div class="tf"><span>Ainda não avaliado</span></div>');
  t.style.display = 'block'; tipPos(ev);
}
function tipPos(ev) {
  const t = document.getElementById('tipFarol'); if (!t || t.style.display !== 'block') return;
  // em telas 4K a dica tem zoom: mede o tamanho na tela e divide a posição pelo zoom
  const z = parseFloat(getComputedStyle(t).zoom) || 1, rc = t.getBoundingClientRect(), w = rc.width, h = rc.height;
  let x = ev.clientX + 16, y = ev.clientY + 18;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 12; if (y + h > innerHeight - 8) y = ev.clientY - h - 12;
  t.style.left = Math.max(8, x) / z + 'px'; t.style.top = Math.max(8, y) / z + 'px';
}
document.addEventListener('mouseover', ev => { const td = ev.target.closest && ev.target.closest('td.cel[data-cel]'); if (td) tipMostrar(td, ev); else { const t = document.getElementById('tipFarol'); if (t) t.style.display = 'none'; } });
document.addEventListener('mousemove', tipPos);
document.addEventListener('scroll', () => { const t = document.getElementById('tipFarol'); if (t) t.style.display = 'none'; }, true);
function popCelula(C, eid, k) {
  const e = C.d.equip.find(x => x.id === eid); if (!e) return;
  const m = MAPA.find(x => x.k === k), x = (e.partes || {})[k], pk = /^r[345]$/.test(k) ? 'rolos' : k, p = PARTE[pk];
  const nc = x && p ? p.ck.map((t, i) => (x.ck || {})[i] === 'nc' ? t + ((x.cn || {})[i] ? ' — ' + x.cn[i] : '') : '').filter(Boolean) : [], cf = x && p ? p.ck.filter((t, i) => (x.ck || {})[i] === 'c').length : 0;
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = `<div class="cx"><button class="fe">Fechar</button><h3>${esc(e.nome)} · ${m.n} ${esc(m.nome)}</h3>
    ${x ? `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">${ICF(x.f).replace('<svg', '<svg width="34" height="34"')}<b style="font-size:18px">${FAROL[x.f]}</b><span style="color:var(--mut)">· ${fData(x.em)} · ${esc(C.I[x.por] ? C.I[x.por].nome : '')}</span></div>

      ${x.f === 'na' ? '<p>Não se aplica a este equipamento.</p>' : ''}
      ${x.c ? `<div class="pcom"><b>Comentário</b><p>${esc(x.c)}</p></div>` : ''}`
      : '<p style="color:var(--mut)">Esta parte ainda não foi avaliada neste equipamento.</p>'}
</div>`;
  d.onclick = ev => { if (ev.target === d || ev.target.classList.contains('fe')) d.remove(); };
  document.body.appendChild(d);
}

/* ----- telas individuais ----- */
const rotItem = r => r.pos === 'car' ? 'nº ' + r.cav : (r.cav || '—') + (r.aa ? ' AA' : '');
const aviso = (r, e) => /^p\d$/.test(r.pos) ? '<div class="av">Pesagem: retirar de operação e comunicar a instrumentação</div>' : r.zb ? '<div class="av am">Zona da balança: rolo específico para balança</div>' : (e && e.bal === 'dos' ? '<div class="av">Balança dosadora: troca crítica</div>' : '');
/* sem NI nesta versão: o item é descrito pelo tipo de rolo da posição */
const catP = r => r.pos === 'cav' ? 'Cavalete' : (/^p\d$/.test(r.pos) || r.zb) ? 'Rolo de balança' : ['ge', 'gd', 'rge', 'rgd'].includes(r.pos) ? 'Rolo guia' : r.pos === 'ret' ? 'Rolo de retorno' : 'Rolo de carga';
const tipoP = (e, r) => { const c = catP(r); return c === 'Rolo de carga' ? e.tcar || '' : c === 'Rolo de retorno' ? e.tret || '' : c === 'Rolo guia' ? e.tlim || '' : c === 'Cavalete' && e.tcar ? 'com rolos ' + e.tcar : ''; };
const nomeI = (C, id) => C.I[id] ? C.I[id].nome : '—';
function tabelaItens(C, e, l) {
  if (!l.length) return '<div class="vazio">Nenhum item pendente. Todos os rolos estão bons.</div>';
  l = l.slice().sort((a, b) => (C.vm(a) ? 0 : 1) - (C.vm(b) ? 0 : 1) || cmp(a.cav, b.cav) || ORDP.indexOf(a.pos) - ORDP.indexOf(b.pos));
  return `<table><thead><tr><th>${e.bal === 'dos' ? 'Nº' : 'Cavalete'}</th><th>Código</th><th>Situação</th><th>Rolo</th><th>Observação</th><th>Marcado por</th></tr></thead><tbody>
    ${l.map(r => { const t = C.T[r.tipoId]; return `<tr><td><b style="font-size:17px">${esc(rotItem(r))}</b></td><td><span class="cod" title="${esc(POSN[r.pos] || '')}">${esc(POS[r.pos] || r.pos)}</span></td>
      <td><span class="sit ${C.vm(r) ? 'vm' : 'am'}">${C.vm(r) ? 'Troca' : 'Atenção'}</span></td><td><b>${esc(catP(r))}</b>${tipoP(e, r) ? '<div style="font-size:12.5px;color:var(--mut)">' + esc(tipoP(e, r)) + '</div>' : ''}${aviso(r, e)}</td><td style="color:var(--mut)">${esc(r.obs || '')}</td>
      <td>${esc(nomeI(C, r.inspId))}<div style="font-size:12.5px;color:var(--mut)">${r.criadoEm ? fData(r.criadoEm) : ''}</div></td></tr>`; }).join('')}</tbody></table>`;
}
function compraDe(C, l) {
  const m = new Map();
  l.forEach(r => { if (!m.has(r.tipoId)) m.set(r.tipoId, { t: C.T[r.tipoId], vm: 0, am: 0 }); m.get(r.tipoId)[C.vm(r) ? 'vm' : 'am']++; });
  const x = [...m.values()]; if (!x.length) return '<div class="vazio">Nada a comprar.</div>';
  let qv = 0, qa = 0, tv = 0, ta = 0;
  return `<table><thead><tr><th>NI</th><th class="n">Troca</th><th class="n">Atenção</th><th class="n">Valor troca</th><th class="n">Troca + atenção</th></tr></thead><tbody>
    ${x.map(y => { const pu = y.t ? Number(y.t.preco) || 0 : 0; qv += y.vm; qa += y.am; tv += pu * y.vm; ta += pu * (y.vm + y.am); return `<tr><td><b>${esc(y.t ? y.t.ni : '—')}</b><div style="font-size:12.5px;color:var(--mut)">${esc(y.t ? y.t.desc || CATN[y.t.cat] : '')}</div></td><td class="n vmT"><b>${y.vm}</b></td><td class="n amT">${y.am}</td><td class="n">${brl(pu * y.vm)}</td><td class="n">${brl(pu * (y.vm + y.am))}</td></tr>`; }).join('')}
    <tr class="tt"><td>Total</td><td class="n vmT">${qv}</td><td class="n amT">${qa}</td><td class="n">${brl(tv)}</td><td class="n">${brl(ta)}</td></tr></tbody></table>`;
}
const tagBal = e => e.bal === 'dos' ? '<span class="tag dos">Balança dosadora</span>' : e.bal === 'tem' ? '<span class="tag">Com balança</span>' : '';
const roletesTxt = (e, x) => e.bal === 'dos' ? '3 de pesagem + ' + nf(e.ncav) + ' de carga = ' + nf(x.total) + ' rolos' : nf(e.ncav) + ' cavaletes · ' + nf(e.nret) + ' de retorno · ' + nf(x.total) + ' rolos';
const farolTxt = (C, e) => e.farol ? FAROL[e.farol] + ' · avaliado em ' + fData(e.farolEm) + (e.farolPor ? ' por ' + nomeI(C, e.farolPor) : '') : 'Semáforo sem avaliação';
function vEquip(C, id) {
  const x = C.eqs.find(y => y.e.id === id); if (!x) return '';
  const e = x.e, l = C.at.filter(r => r.equipId === id), i = C.I[e.inspId];
  const tr = C.d.rol.filter(r => r.equipId === id && r.status === 'trocado' && (r.trocadoEm || 0) > Date.now() - 30 * 864e5).length;
  return `<section class="det">${sem(e.farol)}<div class="f"><h2>${esc(e.nome)} ${tagBal(e)}</h2>
      <div class="m">${esc(e.area || '')}${e.area ? ' · ' : ''}Inspetor: ${i ? `<a href="#" data-ver="insp" data-id="${esc(e.inspId)}" style="color:var(--az)">${esc(i.nome)}</a>` : '—'}${S.area === 'todas' && i ? ' · ' + esc(AREAS[i.area] || '') : ''} · ${esc(roletesTxt(e, x))}</div>
      <div class="m">${esc(farolTxt(C, e))}</div></div></section>
  <section class="kpis">
    <div class="k"><div class="r"><i style="background:var(--vd)"></i>Rolos bons</div><b>${x.total ? pt(pct(x.bons, x.total)) : '—'}</b>${x.total ? barra(x) : ''}<div class="s">${nf(x.bons)} de ${nf(x.total)}</div></div>
    <div class="k"><div class="r"><i style="background:var(--vm)"></i>Para troca</div><b class="vmT">${nf(x.vmN)}</b><div class="s">${pt(pct(x.vmU, x.total))} dos rolos</div></div>
    <div class="k"><div class="r"><i style="background:var(--am)"></i>Em atenção</div><b class="amT">${nf(x.amN)}</b><div class="s">${pt(pct(x.amU, x.total))} dos rolos</div></div>
    <div class="k"><div class="r"><i style="background:#9fb4c6"></i>Trocados em 30 dias</div><b>${nf(tr)}</b><div class="s">baixas neste equipamento</div></div>
  </section>
  <div class="grid">
    <section class="pn"><div class="pt"><h2>Itens pendentes</h2><span>${pl(l.length, 'item', 'itens')} · troca primeiro</span></div>${tabelaItens(C, e, l)}</section>
    <div><section class="pn"><div class="pt"><h2>Farol das partes</h2><span>marcado pelo inspetor</span></div>
      <table><tbody>${MAPA.map(m => { const x = (e.partes || {})[m.k]; return `<tr class="click" data-cel2="${esc(e.id)}|${m.k}"><td style="width:34px;color:var(--mut)">${m.n}</td><td><b>${esc(m.nome)}</b>${x && x.c ? `<div style="font-size:12.5px;color:var(--mut)">${esc(x.c)}</div>` : ''}</td><td style="width:40px">${ICF(x ? x.f : '').replace('<svg', '<svg width="28" height="28"')}</td></tr>`; }).join('')}</tbody></table></section></div>
  </div>`;
}
function vInsp(C, id) {
  const i = C.I[id]; if (!i) return '';
  const meus = C.eqs.filter(x => x.e.inspId === id), l = C.at.filter(r => C.eqs.some(x => x.e.id === r.equipId && x.e.inspId === id));
  const g = C.novo(); l.forEach(r => C.soma(g, r));
  const tot = meus.reduce((s, x) => s + x.total, 0), bons = meus.reduce((s, x) => s + x.bons, 0);
  const far = { vd: 0, am: 0, vm: 0, x: 0 }; meus.forEach(x => { far[FAROL[x.e.farol] ? x.e.farol : 'x']++; });
  const cards = meus.map(x => { const e = x.e, li = l.filter(r => r.equipId === e.id);
    return `<section class="pn eqd"><div class="cab">${sem(e.farol)}<div class="f"><h3><a href="#" data-ver="eq" data-id="${esc(e.id)}" style="color:inherit;text-decoration:none">${esc(e.nome)}</a> ${tagBal(e)}</h3>
        <div class="m" style="color:var(--mut);font-size:14px">${esc(e.area || '')}${e.area ? ' · ' : ''}${esc(roletesTxt(e, x))} · ${esc(farolTxt(C, e))}</div>${barra(x)}</div>
        <div class="mini"><span>Bons <b>${x.total ? pt(pct(x.bons, x.total)) : '—'}</b></span><span>Troca <b class="vmT">${x.vmN}</b></span><span>Atenção <b class="amT">${x.amN}</b></span></div></div>
      ${tabelaItens(C, e, li)}</section>`; }).join('');
  return `<section class="det"><div class="f"><h2>${esc(i.nome)}</h2><div class="m">${i.matricula ? 'Matrícula ' + esc(i.matricula) + ' · ' : ''}${esc(AREAS[i.area] || '')} · ${pl(meus.length, 'equipamento', 'equipamentos')}</div></div>
      <div class="cont" style="margin:0"><div><i style="background:var(--vd)"></i><b>${far.vd}</b> ${far.vd === 1 ? 'bom' : 'bons'}</div><div><i style="background:var(--am)"></i><b>${far.am}</b> em atenção</div><div><i style="background:var(--vm)"></i><b>${far.vm}</b> ${far.vm === 1 ? 'crítico' : 'críticos'}</div><div><i style="background:var(--cz)"></i><b>${far.x}</b> sem avaliação</div></div></section>
  <section class="kpis">
    <div class="k"><div class="r"><i style="background:var(--vd)"></i>Rolos bons</div><b>${tot ? pt(pct(bons, tot)) : '—'}</b>${tot ? barra({ total: tot, amU: g.amU, vmU: g.vmU }) : ''}<div class="s">${nf(tot)} rolos nos equipamentos dele</div></div>
    <div class="k"><div class="r"><i style="background:var(--vm)"></i>Para troca</div><b class="vmT">${nf(g.vmN)}</b><div class="s">itens vermelhos</div></div>
    <div class="k"><div class="r"><i style="background:var(--am)"></i>Em atenção</div><b class="amT">${nf(g.amN)}</b><div class="s">itens amarelos</div></div>
    <div class="k"><div class="r"><i style="background:#9fb4c6"></i>Equipamentos</div><b>${nf(meus.length)}</b><div class="s">clique no nome para ver só um</div></div>
  </section>
  ${cards || '<section class="pn"><div class="vazio">Este inspetor ainda não tem equipamentos cadastrados.</div></section>'}`;
}
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('s')) { S.srv = q.get('s'); ls.set('srv', S.srv); }
  if (q.get('e')) { S.codigo = q.get('e'); ls.set('codigo', S.codigo); }
  if (q.get('a') && (AREAS[q.get('a')] || q.get('a') === 'todas')) { S.area = q.get('a'); ls.set('area', S.area); }
  if (q.get('s') || q.get('e')) history.replaceState(null, '', location.pathname);
  render(); carregar();
  setInterval(carregar, 60000);
  setInterval(() => { const el = document.getElementById('relogio'), d = new Date(); if (el) el.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()); }, 15000);
})();
</script>
